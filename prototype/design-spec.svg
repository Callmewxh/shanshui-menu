    <line x1="0" y1="52" x2="1000" y2="52" class="hair"/>
    <!-- 卡片网格 -->
    <g transform="translate(28,66)">
      <g transform="translate(0,0)">
        <rect width="220" height="200" rx="12" fill="#fff" stroke="rgba(43,38,34,.10)"/>
        <rect x="10" y="10" width="200" height="120" rx="8" fill="#F0B8A0"/>
        <text x="110" y="74" text-anchor="middle" class="tl muted">4:3 缩略图</text>
        <text x="14" y="150" class="ts ink">01 · 迎宾四彩碟</text>
        <text x="14" y="170" class="tl muted">用于 4 个菜单</text>
        <text x="186" y="20" class="ts muted">✕</text>
      </g>
      <g transform="translate(240,0)">
        <rect width="220" height="200" rx="12" fill="#fff" stroke="rgba(43,38,34,.10)"/>
        <rect x="10" y="10" width="200" height="120" rx="8" fill="#F7D9A0"/>
        <text x="110" y="74" text-anchor="middle" class="tl muted">4:3 缩略图</text>
        <text x="14" y="150" class="ts ink">02 · 鸿运乳猪</text>
        <text x="14" y="170" class="tl muted">用于 4 个菜单</text>
        <text x="186" y="20" class="ts muted">✕</text>
      </g>
      <g transform="translate(480,0)">
        <rect width="220" height="200" rx="12" fill="#fff" stroke="rgba(43,38,34,.10)"/>
        <rect x="10" y="10" width="200" height="120" rx="8" fill="#E6C58F"/>
        <text x="110" y="74" text-anchor="middle" class="tl muted">4:3 缩略图</text>
        <text x="14" y="150" class="ts ink">03 · 清蒸龙趸</text>
        <text x="14" y="170" class="tl muted">用于 4 个菜单</text>
        <text x="186" y="20" class="ts muted">✕</text>
      </g>
      <g transform="translate(720,0)">
        <rect width="220" height="200" rx="12" fill="#fff" stroke="rgba(43,38,34,.10)"/>
        <rect x="10" y="10" width="200" height="120" rx="8" fill="#F7D9A0"/>
        <text x="110" y="74" text-anchor="middle" class="tl muted">4:3 缩略图</text>
        <text x="14" y="150" class="ts ink">04 · 石斛炖鸡</text>
        <text x="14" y="170" class="tl muted">用于 4 个菜单</text>
        <text x="186" y="20" class="ts muted">✕</text>
      </g>
    </g>
    <text x="28" y="300" class="tl muted">说明：缩略图与点菜页共用同一 crop 渲染(dishCropThumb)，所见即所得</text>
  </g>

  <!-- ===== 5. 管理-菜单 Menu ===== -->
