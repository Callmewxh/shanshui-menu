<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2800" viewBox="0 0 1080 2800" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .ink{fill:#2B2622} .muted{fill:#8A8178} .prim{fill:#B23A2E} .gold{fill:#B5894E}
      .bg{fill:#F7F2EA} .surface{fill:#FFFFFF} .soft{fill:#F6E3DF}
      .h1{font-size:30px;font-weight:700} .h2{font-size:21px;font-weight:700}
      .t{font-size:14px} .ts{font-size:12px} .tl{font-size:11px}
      .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
      .card{fill:#FFFFFF;stroke:rgba(43,38,34,.14);stroke-width:1.5}
      .hair{stroke:rgba(43,38,34,.12);stroke-width:1}
      .dash{stroke:#B23A2E;stroke-width:1.5;stroke-dasharray:5 4}
      .sw{stroke:rgba(43,38,34,.25);stroke-width:1}
    </style>
  </defs>

  <rect width="1080" height="2800" fill="#F7F2EA"/>

  <!-- ===== 标题 ===== -->
  <g transform="translate(40,26)">
    <rect x="0" y="0" width="6" height="46" rx="3" fill="#B23A2E"/>
    <text x="22" y="26" class="h1 ink">山水S酒店 · 婚宴菜单系统</text>
    <text x="22" y="50" class="t muted">UI 设计规范稿 (Design Spec) · v1 · 供 AI 评审与优化</text>
    <text x="1000" y="26" text-anchor="end" class="ts muted mono">iPad 横屏 1280×800 · PWA</text>
  </g>

  <!-- ===== 1. 设计令牌 ===== -->
  <g transform="translate(40,96)">
    <rect class="card" width="1000" height="372" rx="14"/>
    <text x="28" y="40" class="h2 ink">1 · 设计令牌 Design Tokens</text>

    <!-- 主色板 -->
    <text x="28" y="72" class="ts muted">品牌色 / Brand</text>
    <g>
      <rect x="28"  y="84" width="110" height="54" rx="8" fill="#B23A2E"/><text x="28"  y="156" class="tl mono ink">#B23A2E</text><text x="28" y="171" class="tl muted">喜庆红 primary</text>
      <rect x="150" y="84" width="110" height="54" rx="8" fill="#F6E3DF"/><text x="150" y="156" class="tl mono ink">#F6E3DF</text><text x="150" y="171" class="tl muted">浅红底 soft</text>
      <rect x="272" y="84" width="110" height="54" rx="8" fill="#B5894E"/><text x="272" y="156" class="tl mono ink">#B5894E</text><text x="272" y="171" class="tl muted">金 gold</text>
      <rect x="394" y="84" width="110" height="54" rx="8" fill="#2B2622"/><text x="394" y="156" class="tl mono ink">#2B2622</text><text x="394" y="171" class="tl muted">墨 ink</text>
      <rect x="516" y="84" width="110" height="54" rx="8" fill="#8A8178"/><text x="516" y="156" class="tl mono ink">#8A8178</text><text x="516" y="171" class="tl muted">弱化 muted</text>
      <rect x="638" y="84" width="110" height="54" rx="8" fill="#F7F2EA" stroke="#d8cfc0"/><text x="638" y="156" class="tl mono ink">#F7F2EA</text><text x="638" y="171" class="tl muted">背景 bg</text>
      <rect x="760" y="84" width="110" height="54" rx="8" fill="#FFFFFF" stroke="#d8cfc0"/><text x="760" y="156" class="tl mono ink">#FFFFFF</text><text x="760" y="171" class="tl muted">表面 surface</text>
    </g>

    <!-- 分类色 -->
    <text x="28" y="200" class="ts muted">分类色 / Category (缩略图占位)</text>
    <g>
      <rect x="28"  y="210" width="150" height="40" rx="8" fill="#F7D9A0"/><text x="38" y="235" class="tl ink">凉菜 #F7D9A0</text>
      <rect x="194" y="210" width="150" height="40" rx="8" fill="#F0B8A0"/><text x="204" y="235" class="tl ink">主菜 #F0B8A0</text>
      <rect x="360" y="210" width="170" height="40" rx="8" fill="#E6C58F"/><text x="370" y="235" class="tl ink">主食点心 #E6C58F</text>
      <rect x="546" y="210" width="170" height="40" rx="8" fill="#efe8dc"/><text x="556" y="235" class="tl ink">裁剪底 #efe8dc</text>
    </g>

    <!-- 字体/间距/圆角 -->
    <text x="740" y="200" class="ts muted">字体 / Type</text>
    <text x="740" y="222" class="tl ink">-apple-system, PingFang SC,</text>
    <text x="740" y="239" class="tl ink">Microsoft YaHei, sans-serif</text>
    <text x="740" y="262" class="tl muted">H1 30 · H2 21 · 正文 14 · 小字 12</text>

    <text x="28" y="290" class="ts muted">间距 / Spacing</text>
    <text x="28" y="312" class="tl ink mono">4 · 8 · 12 · 16 · 22(padding) · 24(gap)</text>
    <text x="28" y="338" class="ts muted">圆角 / Radius</text>
    <text x="28" y="360" class="tl ink mono">--radius: 14px · 胶囊 999px · 卡片 14px</text>
  </g>

  <!-- ===== 2. 点菜页 Order ===== -->
  <g transform="translate(40,500)">
    <text x="0" y="-6" class="h2 ink">2 · 点菜页 (Order View) — 客人视角</text>
    <rect class="card" x="0" y="10" width="1000" height="430" rx="14"/>
    <!-- 顶栏 -->
    <rect x="0" y="10" width="1000" height="46" fill="#FFFFFF"/>
    <line x1="0" y1="56" x2="1000" y2="56" class="hair"/>
    <circle cx="40" cy="33" r="14" fill="#F6E3DF"/><text x="62" y="38" class="t ink">S 山水S酒店</text>
    <rect x="300" y="20" width="120" height="26" rx="13" fill="#F6E3DF"/><text x="360" y="38" text-anchor="middle" class="ts prim">点菜 管理</text>
    <rect x="820" y="20" width="120" height="26" rx="13" fill="#F7F2EA"/><text x="880" y="38" text-anchor="middle" class="ts ink">婚宴 ▾</text>
    <rect x="700" y="20" width="100" height="26" rx="13" fill="#F7F2EA"/><text x="750" y="38" text-anchor="middle" class="ts muted">搜索…</text>
    <!-- 档位条 -->
    <rect x="0" y="56" width="1000" height="40" fill="#FFFFFF"/>
    <g>
      <rect x="28" y="66" width="120" height="24" rx="12" fill="#F6E3DF"/><text x="88" y="82" text-anchor="middle" class="tl prim">天作之合宴</text>
      <rect x="160" y="66" width="120" height="24" rx="12" fill="#B23A2E"/><text x="220" y="82" text-anchor="middle" class="tl" fill="#fff">佳偶天成宴</text>
      <rect x="292" y="66" width="120" height="24" rx="12" fill="#F6E3DF"/><text x="352" y="82" text-anchor="middle" class="tl prim">龙凤呈祥宴</text>
    </g>
    <line x1="0" y1="96" x2="1000" y2="96" class="hair"/>
    <!-- hero -->
    <rect x="28" y="108" width="944" height="64" rx="10" fill="#F6E3DF"/>
    <text x="48" y="138" class="t prim">佳偶天成宴 · 16 道 · ¥2899/桌</text>
    <text x="48" y="160" class="ts muted">滑动浏览 · 点开看大图与介绍</text>
    <!-- 卡片网格 3x2 -->
    <g transform="translate(28,188)">
      <!-- 单卡模板：4:3 缩略图 + 标题 + 英文 + 标签 -->
      <g transform="translate(0,0)">
        <rect width="296" height="200" rx="12" fill="#fff" stroke="rgba(43,38,34,.10)"/>
        <rect x="12" y="12" width="272" height="120" rx="8" fill="#F0B8A0"/>
        <text x="150" y="74" text-anchor="middle" class="tl muted">4:3 缩略图(crop)</text>
        <text x="16" y="152" class="t ink">01 · 迎宾四彩碟</text>
        <text x="16" y="172" class="ts muted mono">Welcome Platter</text>
        <rect x="16" y="180" width="48" height="18" rx="9" fill="#F6E3DF"/><text x="40" y="193" text-anchor="middle" class="tl prim">凉菜</text>
      </g>
      <g transform="translate(312,0)">
        <rect width="296" height="200" rx="12" fill="#fff" stroke="rgba(43,38,34,.10)"/>
        <rect x="12" y="12" width="272" height="120" rx="8" fill="#F7D9A0"/>
        <text x="150" y="74" text-anchor="middle" class="tl muted">4:3 缩略图(crop)</text>
        <text x="16" y="152" class="t ink">02 · 鸿运乳猪</text>
        <text x="16" y="172" class="ts muted mono">Roast Goose</text>
        <rect x="16" y="180" width="48" height="18" rx="9" fill="#F6E3DF"/><text x="40" y="193" text-anchor="middle" class="tl prim">主菜</text>
      </g>
      <g transform="translate(624,0)">
        <rect width="296" height="200" rx="12" fill="#fff" stroke="rgba(43,38,34,.10)"/>
        <rect x="12" y="12" width="272" height="120" rx="8" fill="#E6C58F"/>
        <text x="150" y="74" text-anchor="middle" class="tl muted">4:3 缩略图(crop)</text>
        <text x="16" y="152" class="t ink">03 · 清蒸龙趸</text>
        <text x="16" y="172" class="ts muted mono">Grouper</text>
        <rect x="16" y="180" width="48" height="18" rx="9" fill="#F6E3DF"/><text x="40" y="193" text-anchor="middle" class="tl prim">主菜</text>
      </g>
    </g>
  </g>

  <!-- ===== 3. 裁剪编辑器 Crop ===== -->
  <g transform="translate(40,980)">
    <text x="0" y="-6" class="h2 ink">3 · 图片展示位置编辑器 (Crop Editor) — 方案B</text>
    <rect class="card" x="0" y="10" width="1000" height="320" rx="14"/>
    <!-- 完整图铺底 -->
    <rect x="28" y="30" width="560" height="270" rx="8" fill="#efe8dc"/>
    <text x="308" y="170" text-anchor="middle" class="tl muted">完整原图 (object-fit:fill 铺满)</text>
    <!-- 4:3 取景框 -->
    <rect x="120" y="70" width="300" height="225" rx="4" fill="none" stroke="#fff" stroke-width="3"/>
    <rect x="120" y="70" width="300" height="225" rx="4" fill="none" stroke="#B23A2E" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="270" y="188" text-anchor="middle" class="tl" fill="#B23A2E">4:3 取景框</text>
    <!-- 右下角手柄 -->
    <circle cx="420" cy="295" r="9" fill="#fff" stroke="#B23A2E" stroke-width="2"/>
    <text x="436" y="300" class="ts muted">拖拽缩放手柄</text>
    <!-- 说明 -->
    <g transform="translate(620,40)">
      <text x="0" y="0" class="t ink">交互规则</text>
      <text x="0" y="26" class="ts muted">· 框内拖动 = 上下左右平移</text>
      <text x="0" y="50" class="ts muted">· 右下角手柄往外拖 = 框变大(缩小)</text>
      <text x="0" y="74" class="ts muted">· 滑块 100%–400% = 缩放</text>
      <text x="0" y="98" class="ts muted">· 框固定 4:3，图片不变形</text>
      <text x="0" y="128" class="ts muted mono">crop = {x,y,w,h}</text>
      <text x="0" y="152" class="ts muted mono">h = w·0.75·图片宽高比</text>
      <text x="0" y="182" class="ts muted">展示端用 background-size/</text>
      <text x="0" y="202" class="ts muted">position 精确还原(WYSIWYG)</text>
    </g>
    <!-- 缩放滑块 -->
    <rect x="28" y="306" width="120" height="6" rx="3" fill="#F6E3DF"/>
    <circle cx="90" cy="309" r="8" fill="#B23A2E"/>
    <text x="160" y="314" class="ts muted">缩放 150%</text>
  </g>

