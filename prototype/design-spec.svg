  <!-- ===== 6. 组件规格 + 邀请优化 ===== -->
  <g transform="translate(40,2090)">
    <text x="0" y="-6" class="h2 ink">6 · 组件规格 Component Specs</text>
    <rect class="card" x="0" y="10" width="1000" height="220" rx="14"/>
    <!-- 缩略图 4:3 标注 -->
    <g transform="translate(40,40)">
      <rect width="160" height="120" rx="8" fill="#efe8dc" stroke="#B23A2E" stroke-width="1.5"/>
      <line x1="0" y1="60" x2="160" y2="60" class="hair"/><line x1="80" y1="0" x2="80" y2="120" class="hair"/>
      <text x="170" y="40" class="ts ink">缩略图 Thumb</text>
      <text x="170" y="62" class="ts muted mono">aspect-ratio: 4/3</text>
      <text x="170" y="84" class="ts muted mono">.cropimg 100%×100%</text>
      <text x="170" y="106" class="ts muted">background-size/position</text>
      <text x="170" y="126" class="ts muted">精确还原 crop</text>
    </g>
    <!-- 按钮层级 -->
    <g transform="translate(560,40)">
