      <rect x="160" width="150" height="26" rx="6" fill="#F6E3DF"/><text x="235" y="19" text-anchor="middle" class="tl prim">B 佳偶天成</text>
      <rect x="320" width="150" height="26" rx="6" fill="#F6E3DF"/><text x="395" y="19" text-anchor="middle" class="tl prim">C 龙凤呈祥</text>
