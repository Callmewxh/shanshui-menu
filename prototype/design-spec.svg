      <rect x="0" y="14" width="120" height="34" rx="8" fill="#B23A2E"/><text x="60" y="36" text-anchor="middle" class="ts" fill="#fff">主按钮 primary</text>
      <rect x="0" y="58" width="120" height="34" rx="8" fill="#F7F2EA"/><text x="60" y="80" text-anchor="middle" class="ts ink">次按钮 ghost</text>
