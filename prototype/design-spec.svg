    <rect x="28" y="20" width="80" height="24" rx="6" fill="#F7F2EA"/><text x="68" y="37" text-anchor="middle" class="tl ink">菜品库</text>
    <rect x="116" y="20" width="64" height="24" rx="6" fill="#B23A2E"/><text x="148" y="37" text-anchor="middle" class="tl" fill="#fff">菜单</text>
