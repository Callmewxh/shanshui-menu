  <!-- ===== 7. 邀请 AI 优化 ===== -->
  <g transform="translate(40,2360)">
    <rect x="0" y="0" width="1000" height="380" rx="14" fill="#F6E3DF"/>
    <text x="28" y="42" class="h2 prim">7 · 邀请 AI 评审 / 优化方向</text>
    <text x="28" y="78" class="t ink">本规范稿用于请其他 AI 审阅并提出改进。建议聚焦以下问题：</text>
    <text x="28" y="112" class="ts ink">1. 视觉层级：点菜页 hero 区与卡片网格的对比度、信息权重是否清晰？</text>
    <text x="28" y="140" class="ts ink">2. 配色：喜庆红(#B23A2E)在白色卡片上的可读性、金(#B5894E)的落点是否合理？</text>
