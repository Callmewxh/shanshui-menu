<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>山水S酒店 · A4导出设计预览</title>
  <style>
    :root{--red:#b23a2e;--ink:#3a2e26;--paper:#f5f0e6;--gold:#c2a15a;--line:#d8c7a6}
    *{box-sizing:border-box}
    body{margin:0;background:#ded8cd;color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:18px;padding:12px 22px;background:rgba(250,247,240,.96);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(58,46,38,.09);backdrop-filter:blur(12px)}
    .brand{font-family:"Noto Serif SC","Songti SC",serif;font-weight:700;color:var(--red);white-space:nowrap}
    .tabs{display:flex;gap:6px;padding:4px;background:#eae3d7;border-radius:999px}
    button{border:0;background:transparent;color:#75675d;padding:8px 18px;border-radius:999px;cursor:pointer;font-weight:600}
    button.on{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(178,58,46,.22)}
    .scale{margin-left:auto;display:flex;align-items:center;gap:9px;color:#7c6e63;font-size:13px}
    input[type=range]{accent-color:var(--red);width:140px}
    .stage{min-height:calc(100vh - 65px);padding:34px 20px 70px;overflow:auto}
    .sheet{width:794px;height:1123px;margin:0 auto;background:var(--paper);box-shadow:0 18px 50px rgba(44,36,30,.22);transform-origin:top center;transition:transform .15s ease}
    .sheet object{display:block;width:100%;height:100%;border:0}
    .hint{text-align:center;margin:0 0 20px;color:#75675d;font-size:13px}
    @media(max-width:760px){.bar{flex-wrap:wrap;gap:9px;padding:10px 12px}.brand{width:100%}.scale{margin-left:0}.stage{padding:22px 8px 50px}.sheet{transform-origin:top left}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand">山水S酒店 · A4导出预览</div>
    <div class="tabs">
      <button class="on" data-src="latest-photo.svg">带图版</button>
      <button data-src="latest-plain.svg">无图版</button>
    </div>
    <label class="scale">缩放 <input id="zoom" type="range" min="35" max="100" value="70"><span id="zoomText">70%</span></label>
  </header>
  <main class="stage">
    <p class="hint">A4 竖版 · 210 × 297 mm　｜　使用真实套餐与菜品数据</p>
    <div class="sheet" id="sheet"><object id="preview" data="latest-photo.svg" type="image/svg+xml"></object></div>
  </main>
  <script>
    const sheet=document.getElementById('sheet'),preview=document.getElementById('preview');
    const zoom=document.getElementById('zoom'),zoomText=document.getElementById('zoomText');
    function applyZoom(){const z=Number(zoom.value)/100;sheet.style.transform=`scale(${z})`;sheet.parentElement.style.height=(1123*z+120)+'px';zoomText.textContent=zoom.value+'%'}
    zoom.addEventListener('input',applyZoom);applyZoom();
    document.querySelectorAll('button[data-src]').forEach(btn=>btn.addEventListener('click',()=>{
      document.querySelectorAll('button[data-src]').forEach(x=>x.classList.remove('on'));btn.classList.add('on');preview.data=btn.dataset.src;
    }));
  </script>
</body>
</html>
