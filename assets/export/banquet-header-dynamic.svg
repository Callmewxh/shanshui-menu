<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="300" viewBox="0 0 1600 300">
  <!--
    Header visual prototype. In the export renderer, replace these values at export time:
    #brandLogo.href <- localStorage.ss_brand_logo (same source as the app header)
    #brandName, #menuTitle, #menuPrice, #headerSlogan <- current menu / tenant settings
    The background intentionally contains NO text and NO reference logo.
  -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#f4eee0"/></linearGradient>
    <filter id="paperGrain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="4"/><feColorMatrix values="1 0 0 0 .72 0 1 0 0 .61 0 0 1 0 .42 0 0 0 .055 0"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
    <style>
      .brand { font-family: "Noto Serif SC", "Songti SC", STSong, SimSun, serif; fill:#9c3128; }
      .title { font-family: "Noto Serif SC", "Songti SC", STSong, SimSun, serif; fill:#4a1515; font-weight:700; }
      .small { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill:#af9471; }
      .price { font-family: "Noto Serif SC", "Times New Roman", serif; fill:#a6312b; }
    </style>
  </defs>
  <!-- fixed no-text template -->
  <rect width="1600" height="300" fill="url(#paper)"/>
  <rect width="1600" height="300" filter="url(#paperGrain)" opacity=".38"/>
  <path d="M0 8H1600" stroke="#a4342b" stroke-width="8"/>
  <path d="M0 14H1600" stroke="#c9a75d" stroke-width="2" opacity=".85"/>
  <path d="M32 22h28v14h14v28M32 22v42M1568 22h-28v14h-14v28M1568 22v42" fill="none" stroke="#c2a166" stroke-width="3"/>
  <path d="M590 212h420" stroke="#d5bd89" stroke-width="1.5"/>
  <path d="M590 212h-34M1010 212h34" stroke="#d5bd89" stroke-width="1.5"/>
  <!-- dynamic left: only application brand logo; the reference logo is not used -->
  <clipPath id="logoClip"><circle cx="86" cy="105" r="43"/></clipPath>
  <image id="brandLogo" href="../pad-default-hotel-logo.png" xlink:href="../pad-default-hotel-logo.png" x="43" y="62" width="86" height="86" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/>
  <text id="brandName" class="brand" x="154" y="108" font-size="38" letter-spacing="7">山水S酒店</text>
  <text class="small" x="157" y="143" font-size="11" letter-spacing="5">SHAN SHUI HOTEL</text>
  <text class="small" x="157" y="174" font-size="12" letter-spacing="7">山 水 有 情　宴 遇 美 好</text>
  <!-- dynamic centre -->
  <text id="menuTitle" class="title" x="800" y="118" text-anchor="middle" font-size="64" letter-spacing="14">宴会菜单</text>
  <text id="headerSlogan" class="small" x="800" y="172" text-anchor="middle" font-size="15" letter-spacing="7">珍 馐美馔　共 聚 美 好 时 光</text>
  <!-- dynamic right -->
  <text class="small" x="1450" y="87" text-anchor="end" font-size="14">菜单价格</text>
  <text id="menuPrice" class="price" x="1450" y="132" text-anchor="end" font-size="48">¥1888<tspan font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17"> / 桌</tspan></text>
</svg>
